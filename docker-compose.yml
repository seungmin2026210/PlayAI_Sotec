services:
  db:
    image: postgres:15
    container_name: quote_db
    environment:
      POSTGRES_USER: quote
      POSTGRES_PASSWORD: quote
      POSTGRES_DB: quote
    ports:
      - "5432:5432"
    volumes:
      - quote_pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quote"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  quote_pgdata:
